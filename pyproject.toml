[project]
name = "tradebot1"
version = "1.0.0"
description = "Institutional-grade automated rule-based options trading bot for NSE Nifty index options"
authors = [{ name = "Algorithmic Trading Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "kiteconnect>=5.0.1",
    "smartapi-python>=1.3.0",
    "pyotp>=2.9.0",
    "apscheduler>=3.10.4",
    "pytz>=2024.1",
    "pyarrow>=15.0.0",
    "pandas>=2.2.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
